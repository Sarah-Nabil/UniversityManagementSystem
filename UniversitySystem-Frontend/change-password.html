
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Geist Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Geist', sans-serif;
    }
  </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">

  <!-- Card Wrapper -->
  <div class="w-full max-w-[420px] rounded-3xl bg-zinc-900/60 border border-zinc-800/80 p-6 shadow-2xl backdrop-blur-xl">

    <!-- Card Header -->
    <div class="text-center space-y-1.5 mb-6">
      <h1 class="text-xl font-medium tracking-tight text-white">Change Password</h1>
      <p class="text-sm text-zinc-400">Please enter your current password and choose a new one.</p>
    </div>

    <!-- Form -->
    <form id="change-password-form" class="space-y-4">

      <!-- Current Password -->
      <div class="space-y-2">
        <label for="currentPassword" class="block text-sm font-medium text-zinc-300">
          Current Password
        </label>

        <input
          type="password"
          id="currentPassword"
          name="currentPassword"
          placeholder="••••••••"
          autocomplete="current-password"
          required
          class="w-full h-10 px-3.5 rounded-2xl bg-zinc-800/40 border border-zinc-800 text-sm text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all"
        />

        <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer">
          <input
            type="checkbox"
            class="show-password accent-white"
            data-target="currentPassword"
          />
          Show password
        </label>
      </div>

      <!-- New Password -->
      <div class="space-y-2">
        <label for="newPassword" class="block text-sm font-medium text-zinc-300">
          New Password
        </label>

        <input
          type="password"
          id="newPassword"
          name="newPassword"
          placeholder="••••••••"
          autocomplete="new-password"
          required
          class="w-full h-10 px-3.5 rounded-2xl bg-zinc-800/40 border border-zinc-800 text-sm text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all"
        />

        <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer">
          <input
            type="checkbox"
            class="show-password accent-white"
            data-target="newPassword"
          />
          Show password
        </label>
      </div>

      <!-- Confirm New Password -->
      <div class="space-y-2">
        <label for="confirmPassword" class="block text-sm font-medium text-zinc-300">
          Confirm New Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
          required
          class="w-full h-10 px-3.5 rounded-2xl bg-zinc-800/40 border border-zinc-800 text-sm text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all"
        />

        <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer">
          <input
            type="checkbox"
            class="show-password accent-white"
            data-target="confirmPassword"
          />
          Show password
        </label>
      </div>

      <!-- Actions -->
      <div class="pt-2 flex flex-col gap-2.5">

        <button
          type="submit"
          class="w-full h-10 rounded-2xl bg-white hover:bg-zinc-200 text-zinc-950 font-medium text-sm transition-all active:scale-[0.99]"
        >
          Change Password
        </button>

        <button
          type="button"
          id="cancel-button"
          class="w-full h-10 rounded-2xl bg-zinc-800/50 hover:bg-zinc-800 border border-zinc-700/50 text-zinc-300 font-medium text-sm transition-all active:scale-[0.99]"
        >
          Cancel
        </button>

      </div>

    </form>

  </div>

 <script src="./javascript/auth.js"></script>
<script src="./javascript/change-password.js"></script>
</body>
</html>
